{% extends "base.html" %}
{% block title %}إضافة / تعديل جزاء موقع{% endblock %}

{% block content %}
<div class="container-fluid">
    <div class="card card-primary card-outline">
        <div class="card-header">
            <h3 class="card-title">بيانات الجزاء الموقع</h3>
        </div>
        <form method="post">
            {% csrf_token %}
            <div class="card-body">
                <div class="form-group">
                    <label>اسم الجزاء الموقع</label>
                    {{ form.name }}
                </div>
                <div class="form-group">
                    <label>تصنيف الجزاء</label>
                    {{ form.penalty_level }}
                </div>
            </div>
            <div class="card-footer">
                <button type="submit" class="btn btn-primary">حفظ</button>
                <a href="{% url 'penalties:applied_list' %}" class="btn btn-secondary">رجوع</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
