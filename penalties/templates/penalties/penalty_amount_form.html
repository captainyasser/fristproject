{% extends 'base.html' %}
{% block title %}مقدار الجزاء{% endblock %}

{% block content %}
<div class="">
<section class="content-header">
<div class="container-fluid">
<div class="row mb-2">
<div class="col-sm-6">
<h1>مقدار الجزاء</h1>
</div>
<div class="col-sm-6">
<ol class="breadcrumb float-sm-right">
<li class="breadcrumb-item"><a href="{% url 'penalties:dashboard' %}">الجزاءات</a></li>
<li class="breadcrumb-item active">مقدار الجزاء</li>
</ol>
</div>
</div>
</div>
</section>

<section class="content">
<div class="container-fluid">
<form method="post">
{% csrf_token %}

<div class="card card-primary card-outline">
<div class="card-body">
<div class="row">

<div class="col-md-4">
<div class="form-group">
<label>الجزاء الموقع</label>
{{ form.penalty_applied }}
</div>
</div>

<div class="col-md-4">
<div class="form-group">
<label>نص المقدار</label>
{{ form.text_value }}
</div>
</div>

<div class="col-md-4">
<div class="form-group">
<label>العدد</label>
{{ form.numeric_value }}
<small class="form-text text-muted">يقبل الكسور مثل 0.25 / 0.5</small>
</div>
</div>

</div>
</div>

<div class="card-footer">
<button type="submit" class="btn btn-primary">
<i class="fas fa-save"></i> حفظ
</button>
<a href="{% url 'penalties:dashboard' %}" class="btn btn-default float-left">إلغاء</a>
</div>

</div>
</form>
</div>
</section>
</div>
{% endblock %}
