{% extends "base.html" %}
{% load static %}
{% load tz %}  {# لتحويل التواريخ إذا لزم #}

{% block content %}
<div class="container mt-4">
    <a href="{% url 'elawat_tashgeea:index' %}" class="btn btn-secondary">
← رجوع
</a>
    <div class="card p-4 shadow">
        <h3 class="text-center">عرض العلاوات التشجيعية لفرد</h3>

        <form method="get" action="{% url 'elawat_tashgeea:employee_elawat_select' %}">
            <label class="mt-3">اختر الفرد:</label>
            <select name="employee_id" class="form-control" required>
                <option value="">-- اختر الفرد --</option>
                {% for emp in employees %}
                    <option value="{{ emp.id }}">{{ emp.sort_number }} - {{ emp.name }}</option>
                {% endfor %}
            </select>

            <button class="btn btn-success mt-3 w-100">عرض العلاوات</button>
        </form>

        <hr class="mt-4">

        <h5 class="mt-3">تعديل العلاوات:</h5>
        <div class="list-group">
            {% for emp in employees %}
                <div class="d-flex justify-content-between align-items-center mb-1">
                    <span>{{ emp.sort_number }} - {{ emp.name }}</span>
                    <a href="{% url 'elawat_tashgeea:employee_elawat' emp.id %}" 
                       class="btn btn-warning btn-sm">
                        تعديل العلاوات
                    </a>
                </div>
            {% endfor %}
        </div>

    </div>
</div>
{% endblock %}
