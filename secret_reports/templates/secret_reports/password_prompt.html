{% comment %} {% extends 'base.html' %}
{% block content %}
<div class="container text-center mt-5">
    <div class="card shadow-lg p-4 mx-auto" style="max-width: 400px;">
        <h4 class="mb-3 text-primary">إدخال كلمة المرور</h4>
        {% if error %}
            <div class="alert alert-danger">{{ error }}</div>
        {% endif %}
        <form method="post">
            {% csrf_token %}
            <input type="password" name="password" class="form-control mb-3" placeholder="كلمة المرور" required>
            <button class="btn btn-success w-100">تأكيد</button>
        </form>
        <a href="{% url 'secret_reports:index' %}" class="btn btn-outline-secondary w-100 mt-3">رجوع للرئيسية</a>
    </div>
</div>
{% endblock %} {% endcomment %}
