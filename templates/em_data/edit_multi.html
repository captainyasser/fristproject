<!-- em_data/edit_multi.html -->
{% extends "base.html" %}
{% load static %}

{% block content %}
    <div class="container" dir="rtl">
        <div class="container-fluid">
            <div class="row">
                <div class="col-md-12">
                    <h1>تعديل بيانات الأفراد</h1>
                    <form id="field-select-form">
                        <div class="form-group">
                            <label for="sort_by">ترتيب حسب:</label>
                            <select id="sort_by" name="sort_by" class="form-control">
                                <option value="sort_number">رقم الترتيب</option>
                                <option value="seniority_order">ترتيب الأقدمية المطلقة</option>
                                <option value="dep_sort">ترتيب القسم</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="field">اختر الحقل المراد تعديله:</label>
                            <select id="field" name="field" class="form-control" required>
                                <option value="">-- اختر حقلًا --</option>
                                <option value="id_number">الرقم القومي</option>
                                <option value="date_of_birth">تاريخ الميلاد</option>
                                <option value="date_of_retirement">تاريخ التقاعد</option>
                                <option value="age">العمر</option>
                                <option value="name">الاسم</option>
                                <option value="mainornot">رئيسي أم لا</option>
                                <option value="sort_number">رقم الترتيب</option>
                                <option value="seniority_order">ترتيب الأقدمية المطلقة</option>
                                <option value="dep_sort">ترتيب القسم</option>
                                <option value="image">الصورة</option>
                                <option value="amen_or_ola">أمن أو علا</option>
                                <option value="rank">الدرجة</option>
                                <option value="rank_kind">نوع الرتبة</option>
                                <option value="nickname">اللقب</option>
                                <option value="police_number">رقم الشرطة</option>
                                <option value="insurance_number">رقم التأمين</option>
                                <option value="date_of_edara">تاريخ دخول الإدارة</option>
                                <option value="date_of_appointment">تاريخ التعيين</option>
                                <option value="phone_number">رقم الهاتف</option>
                                <option value="alt_phone_number">رقم الهاتف البديل</option>
                                <option value="marital_status">الحالة الاجتماعية</option>
                                <option value="gender">الجنس</option>
                                <option value="governorate">المحافظة</option>
                                <option value="district">المنطقة</option>
                                <option value="address">العنوان</option>
                                <option value="health_status">الحالة الصحية</option>
                                <option value="tmamam">يحضر التمام</option>
                                <option value="food">الحصول على تعيين</option>
                                <option value="rahatcounter">عداد الراحة</option>
                                <option value="department">القسم</option>
                                <option value="total_leave">إجمالي الإجازات</option>
                                <option value="bus">يستقل الأتوبيس</option>
                                <option value="nots">ملاحظات</option>
                                <option value="operation">التشغيل</option>
                                <option value="batch_number">رقم الدفعة</option>
                                <option value="dryfood">dryfood</option>
                                <option value="mony_out">مستحقات مالية خارج الإدارة</option>
                                <option value="job_title">المسمى الوظيفي</option>
                                <option value="job_description">الوصف الوظيفي</option>
                                <option value="primary_instrument">الآلة الموسيقية</option>
                            </select>
                        </div>
                    </form>

                    <div class="form-container" id="edit-form-container">
                        <form id="edit-form">
                            {% csrf_token %}
                            <div class="form-group">
                                <label id="edit-label"></label>
                                <table class="table">
                                    <thead>
                                        <tr>
                                            <th>م</th>
                                            <th>الاسم</th>
                                            <th>الدرجة</th>
                                            <th>القيمة الحالية</th>
                                            <th>القيمة الجديدة</th>
                                        </tr>
                                    </thead>
                                    <tbody id="edit-inputs"></tbody>
                                </table>
                            </div>
                            <button type="button" id="fill-sort-numbers" class="btn btn-info" style="display: none;">ملء أرقام الترتيب</button>
                            <button type="button" id="calculate-seniority-btn" class="btn btn-warning" style="display: none;">ضبط ترتيب الأقدمية تلقائياً</button>
                            <button type="submit" class="btn btn-primary">حفظ</button>
                        </form>
                    </div>

                    <div id="messages" class="mt-3"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // token is already defined in base.html
        const apiUrl = "/api/employees/";
        const csrfToken = "{{ csrf_token }}";
        let employeesData = [];
        let departments = [];
        let ranks = [];
        let instruments = [];

        document.addEventListener("DOMContentLoaded", function() {
            Promise.all([
                fetch("/api/departments/", { headers: { "Authorization": `Token ${token}` } })
                    .then(res => res.json())
                    .then(data => departments = data),
                fetch("/api/ranks/", { headers: { "Authorization": `Token ${token}` } })
                    .then(res => res.json())
                    .then(data => ranks = data),
                fetch("/api/em_data/instruments/", { headers: { "Authorization": `Token ${token}` } })
                    .then(res => res.json())
                    .then(data => instruments = data),
                loadEmployees()
            ]).catch(error => {
                console.error("Error loading initial data:", error);
                showMessage("حدث خطأ أثناء تحميل البيانات الأولية", "danger");
            });

            document.getElementById("sort_by").addEventListener("change", loadEmployees);
            document.getElementById("field").addEventListener("change", handleFieldChange);
            document.getElementById("fill-sort-numbers").addEventListener("click", fillSortNumbers);
            document.getElementById("calculate-seniority-btn").addEventListener("click", calculateSeniority);
        });

        function handleFieldChange() {
            const field = this.value;
            const container = document.getElementById("edit-form-container");
            const label = document.getElementById("edit-label");
            const inputsBody = document.getElementById("edit-inputs");
            const fillButton = document.getElementById("fill-sort-numbers");

            if (field && employeesData.length > 0) {
                container.style.display = "block";
                label.textContent = document.querySelector(`#field option[value="${field}"]`).text;
                renderInputs(field);
                // إظهار زر الملء فقط عند اختيار sort_number
                fillButton.style.display = (field === "sort_number") ? "inline-block" : "none";
                document.getElementById("calculate-seniority-btn").style.display = (field === "seniority_order") ? "inline-block" : "none";
            } else {
                container.style.display = "none";
                inputsBody.innerHTML = "";
                fillButton.style.display = "none";
                document.getElementById("calculate-seniority-btn").style.display = "none";
            }
        }

        function loadEmployees() {
            const sortBy = document.getElementById("sort_by").value;
            return fetch(`${apiUrl}?sort_by=${sortBy}`, {
                headers: {
                    "Authorization": `Token ${token}`,
                    "Content-Type": "application/json"
                }
            })
            .then(response => {
                if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
                return response.json();
            })
            .then(data => {
                employeesData = data;
                const field = document.getElementById("field").value;
                if (field) renderInputs(field);
            })
            .catch(error => {
                console.error("Error loading employees:", error);
                showMessage(`حدث خطأ أثناء جلب بيانات الموظفين: ${error.message}`, "danger");
            });
        }

        function renderInputs(field) {
            const tbody = document.getElementById("edit-inputs");
            tbody.innerHTML = "";
            
            if (!employeesData.length) {
                tbody.innerHTML = "<tr><td colspan='5'>لا توجد بيانات لعرضها</td></tr>";
                return;
            }

            // Update header
            const thead = tbody.closest('table').querySelector('thead tr');
            thead.innerHTML = `
                <th>م</th>
                <th>الاسم</th>
                <th>الدرجة</th>
                <th>القيمة الحالية</th>
                <th>القيمة الجديدة</th>
            `;

            employeesData.forEach((employee, index) => {
                const row = document.createElement("tr");
                row.innerHTML = `
                    <td>${index + 1}</td>
                    <td>${employee.name || '-'}</td>
                    <td>${employee.rank ? employee.rank.name : '-'}</td>
                    <td>${getCurrentValue(employee, field)}</td>
                    <td>${getInputField(employee, field)}</td>
                `;
                tbody.appendChild(row);
            });
        }

        function getCurrentValue(employee, field) {
            if (field === "department" && employee.department) return employee.department.name || "-";
            if (field === "rank" && employee.rank) return employee.rank.name || "-";
            if (field === "primary_instrument" && employee.primary_instrument) return employee.primary_instrument.name || "-";
            if (["tmamam", "food", "bus", "amen_or_ola", "dryfood", "mony_out"].includes(field)) return employee[field] ? "نعم" : "لا";
            if (["date_of_edara", "date_of_appointment", "date_of_birth", "date_of_retirement"].includes(field)) {
                return employee[field] ? new Date(employee[field]).toLocaleDateString("ar-EG") : "-";
            }
            if (field === "image" && employee.image) return `<img src="${employee.image}" width="50">`;
            return employee[field] || "-";
        }

        function getInputField(employee, field) {
            if (["name", "id_number", "nickname", "police_number", "insurance_number", "phone_number", "alt_phone_number", "governorate", "district", "address", "batch_number", "job_title"].includes(field)) {
                return `<input type="text" class="form-control edit-value" data-id="${employee.id}" value="${employee[field] || ''}">`;
            }
            if (field === "department") {
                return `<select class="form-control edit-value" data-id="${employee.id}">
                    <option value="">-- اختر قسمًا --</option>
                    ${departments.map(d => `<option value="${d.id}" ${employee.department && employee.department.id === d.id ? "selected" : ""}>${d.name}</option>`).join('')}
                </select>`;
            }
            if (field === "rank") {
                return `<select class="form-control edit-value" data-id="${employee.id}">
                    <option value="">-- اختر درجة --</option>
                    ${ranks.map(r => `<option value="${r.id}" ${employee.rank && employee.rank.id === r.id ? "selected" : ""}>${r.name}</option>`).join('')}
                </select>`;
            }
            if (field === "primary_instrument") {
                return `<select class="form-control edit-value" data-id="${employee.id}">
                    <option value="">-- اختر آلة --</option>
                    ${instruments.map(i => `<option value="${i.id}" ${employee.primary_instrument && employee.primary_instrument.id === i.id ? "selected" : ""}>${i.name}</option>`).join('')}
                </select>`;
            }
            if (["tmamam", "food", "bus", "amen_or_ola", "mainornot", "dryfood", "mony_out"].includes(field)) {
                return `<input type="checkbox" class="form-check-input edit-value" data-id="${employee.id}" ${employee[field] ? "checked" : ""}>`;
            }
            if (["date_of_edara", "date_of_appointment", "date_of_birth", "date_of_retirement"].includes(field)) {
                const dateValue = employee[field] ? new Date(employee[field]).toISOString().split('T')[0] : '';
                return `<input type="date" class="form-control edit-value" data-id="${employee.id}" value="${dateValue}">`;
            }
            if (["age", "sort_number", "seniority_order", "dep_sort", "total_leave", "rank_kind"].includes(field)) {
                return `<input type="number" class="form-control edit-value" data-id="${employee.id}" value="${employee[field] || ''}">`;
            }
            if (field === "rahatcounter") {
                return `<input type="number" class="form-control edit-value" data-id="${employee.id}" value="${employee[field] || ''}">`;
            }
            if (field === "rank_kind") {
                return `<select class="form-control edit-value" data-id="${employee.id}">
                    <option value="1" ${employee[field] === 1 ? "selected" : ""}>أمناء</option>
                    <option value="2" ${employee[field] === 2 ? "selected" : ""}>مساعدين</option>
                    <option value="3" ${employee[field] === 3 ? "selected" : ""}>مراقبين</option>
                    <option value="4" ${employee[field] === 4 ? "selected" : ""}>مندوبين</option>
                    <option value="5" ${employee[field] === 5 ? "selected" : ""}>رقيب أول</option>
                    <option value="6" ${employee[field] === 6 ? "selected" : ""}>رقيب</option>
                    <option value="7" ${employee[field] === 7 ? "selected" : ""}>عريف</option>
                    <option value="8" ${employee[field] === 8 ? "selected" : ""}>شرطيين</option>
                    <option value="9" ${employee[field] === 9 ? "selected" : ""}>معاونين</option>
                </select>`;
            }
            if (field === "marital_status") {
                return `<select class="form-control edit-value" data-id="${employee.id}">
                    <option value="أعزب" ${employee[field] === "أعزب" ? "selected" : ""}>أعزب</option>
                    <option value="متزوج" ${employee[field] === "متزوج" ? "selected" : ""}>متزوج</option>
                    <option value="مطلق" ${employee[field] === "مطلق" ? "selected" : ""}>مطلق</option>
                </select>`;
            }
            if (field === "gender") {
                return `<select class="form-control edit-value" data-id="${employee.id}">
                    <option value="ذكر" ${employee[field] === "ذكر" ? "selected" : ""}>ذكر</option>
                    <option value="أنثى" ${employee[field] === "أنثى" ? "selected" : ""}>أنثى</option>
                </select>`;
            }
            if (field === "health_status") {
                return `<select class="form-control edit-value" data-id="${employee.id}">
                    <option value="جيدة" ${employee[field] === "جيدة" ? "selected" : ""}>جيدة</option>
                    <option value="عمل إداري مكتبي" ${employee[field] === "عمل إداري مكتبي" ? "selected" : ""}>عمل إداري مكتبي</option>
                    <option value="ممنوع من حمل السلاح" ${employee[field] === "ممنوع من حمل السلاح" ? "selected" : ""}>ممنوع من حمل السلاح</option>
                </select>`;
            }
            if (field === "operation") {
                return `<select class="form-control edit-value" data-id="${employee.id}">
                    <option value="لم يحدد" ${employee[field] === "لم يحدد" ? "selected" : ""}>لم يحدد</option>
                    <option value="السبت" ${employee[field] === "السبت" ? "selected" : ""}>السبت</option>
                    <option value="الأحد" ${employee[field] === "الأحد" ? "selected" : ""}>الأحد</option>
                    <option value="الاثنين" ${employee[field] === "الاثنين" ? "selected" : ""}>الاثنين</option>
                    <option value="الثلاثاء" ${employee[field] === "الثلاثاء" ? "selected" : ""}>الثلاثاء</option>
                    <option value="الأربعاء" ${employee[field] === "الأربعاء" ? "selected" : ""}>الأربعاء</option>
                    <option value="الخميس" ${employee[field] === "الخميس" ? "selected" : ""}>الخميس</option>
                    <option value="الجمعة" ${employee[field] === "الجمعة" ? "selected" : ""}>الجمعة</option>
                    <option value="عمل يومي" ${employee[field] === "عمل يومي" ? "selected" : ""}>عمل يومي</option>
                    <option value="انتداب" ${employee[field] === "انتداب" ? "selected" : ""}>انتداب</option>
                    <option value="قرار66" ${employee[field] === "قرار66" ? "selected" : ""}>قرار66</option>
                    <option value="خاصه" ${employee[field] === "خاصه" ? "selected" : ""}>خاصه</option>
                </select>`;
            }
            if (field === "nots" || field === "job_description") {
                return `<textarea class="form-control edit-value" data-id="${employee.id}">${employee[field] || ''}</textarea>`;
            }
            if (field === "image") {
                return `<input type="file" class="form-control edit-value" data-id="${employee.id}">`;
            }
            return `<input type="text" class="form-control edit-value" data-id="${employee.id}" value="${employee[field] || ''}">`;
        }

        function fillSortNumbers() {
            const inputs = document.querySelectorAll(".edit-value");
            inputs.forEach((input, index) => {
                input.value = index + 1;
            });
        }

        function calculateSeniority() {
            if (!confirm("هل أنت متأكد من رغبتك في حساب ترتيب الأقدمية المبدئي للأفراد المعروضين؟ \n سيتم ملء القيم في الجدول، وعليك الضغط على زر حفظ لتثبيتها. \n (الترتيب: الدرجة -> تاريخ الترقية -> السن -> رقم الشرطة)")) return;
            
            fetch(`${apiUrl}get-seniority-calculation/`, {
                method: "GET",
                headers: {
                    "Authorization": `Token ${token}`,
                    "Content-Type": "application/json"
                }
            })
            .then(response => response.json())
            .then(data => {
                if (data.seniority_map) {
                    // convert all keys to string for comparison with dataset.id
                    const seniorityMap = {};
                    Object.keys(data.seniority_map).forEach(k => {
                        seniorityMap[String(k)] = data.seniority_map[k];
                    });

                    const inputs = document.querySelectorAll(".edit-value");
                    let filledCount = 0;
                    inputs.forEach(input => {
                        const empId = String(input.dataset.id);
                        if (seniorityMap[empId] !== undefined) {
                            input.value = seniorityMap[empId];
                            filledCount++;
                        }
                    });
                    showMessage(`تم حساب الترتيب لـ ${filledCount} فرد. يرجى مراجعة الجدول ثم الضغط على حفظ.`, "info");
                } else {
                    showMessage("لم يُرجع الخادم بيانات أقدمية.", "warning");
                }
            })
            .catch(error => {
                console.error("Error calculating seniority:", error);
                showMessage("حدث خطأ أثناء جلب حسابات الأقدمية", "danger");
            });
        }

        document.getElementById("edit-form").addEventListener("submit", function(e) {
            e.preventDefault();
            const field = document.getElementById("field").value;
            const updates = {};
        
            document.querySelectorAll(".edit-value").forEach(input => {
                const id = input.dataset.id;
                let value;
        
                if (input.type === "checkbox") {
                    value = input.checked;
                } else if (input.type === "file") {
                    return; // Skip file inputs for now
                } else if (["date_of_edara", "date_of_appointment", "date_of_birth", "date_of_retirement"].includes(field)) {
                    value = input.value || null;
                } else if (["age", "sort_number", "seniority_order", "dep_sort", "total_leave", "rank_kind", "mainornot"].includes(field)) {
                    value = input.value ? parseInt(input.value) : null;
                } else if (field === "rahatcounter") {
                    value = input.value !== "" ? parseInt(input.value) : null;
                } else if (["department", "rank", "primary_instrument"].includes(field)) {
                    value = input.value ? parseInt(input.value) : null;
                } else {
                    value = input.value || null;
                }
        
                const employee = employeesData.find(emp => emp.id.toString() === id);
                const currentValue = getRawCurrentValue(employee, field);
                if (value !== currentValue && value !== "") {
                    updates[id] = value;
                }
            });
        
            if (Object.keys(updates).length === 0) {
                showMessage("لا توجد تغييرات للحفظ", "warning");
                return;
            }
        
            console.log("Sending updates:", { field, updates });
        
            fetch(`${apiUrl}bulk-update/`, {
                method: "PATCH",
                headers: {
                    "Authorization": `Token ${token}`,
                    "Content-Type": "application/json",
                    "X-CSRFToken": csrfToken
                },
                body: JSON.stringify({ field, updates })
            })
            .then(response => {
                console.log("Response status:", response.status);
                if (!response.ok) {
                    return response.json().then(err => {
                        throw new Error(`HTTP error! status: ${response.status}, message: ${JSON.stringify(err)}`);
                    });
                }
                return response.json();
            })
            .then(data => {
                console.log("Response data:", data);
                showMessage(data.message || "تم الحفظ بنجاح", "success");
                loadEmployees();
            })
            .catch(error => {
                console.error("Error saving changes:", error);
                showMessage(`حدث خطأ أثناء الحفظ: ${error.message}`, "danger");
            });
        });

        function getRawCurrentValue(employee, field) {
            if (["tmamam", "food", "bus", "amen_or_ola", "dryfood", "mony_out"].includes(field)) {
                return employee[field];
            }
            if (["department", "rank", "primary_instrument"].includes(field)) {
                return employee[field] ? employee[field].id : null;
            }
            if (["date_of_edara", "date_of_appointment", "date_of_birth", "date_of_retirement"].includes(field)) {
                return employee[field] ? new Date(employee[field]).toISOString().split('T')[0] : null;
            }
            return employee[field] || null;
        }

        function showMessage(message, type) {
            const messagesDiv = document.getElementById("messages");
            messagesDiv.innerHTML = `<div class="alert alert-${type}">${message}</div>`;
            setTimeout(() => messagesDiv.innerHTML = "", 5000);
        }
    </script>
{% endblock %}
