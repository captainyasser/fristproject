<title>يومية عددية</title>

{% load static %}

{% block content %}

            <div class="row">
                <div class="col-md-12">
                    <style>

                            font-family: Arial, sans-serif;
                            background-color: #f4f4f4;
                            margin: 0;
                            padding: 20px;
                        }
                        h1, h3 {
                            text-align: center;
                            color: #333;
                        }
                        .form-container {
                            text-align: center;
                            margin-bottom: 20px;
                        }
                        label {
                            font-size: 25px;
                            margin-left: 10px;
                        }
                        input[type="date"] {
                            padding: 5px;
                            font-size: 25px;
                        }
                        button {
                            padding: 5px 15px;
                            font-size: 25px;
                            background-color: #007bff;
                            color: white;
                            border: none;
                            cursor: pointer;
                        }
                        button:hover {
                            background-color: rgb(1, 23, 46);
                        }
                        table {
                            width: 100%;
                            border-collapse: collapse;
                            margin-top: 20px;
                            background-color: white;
                            direction: rtl;
                        }
                        table, th, td {
                            border: 2px solid #ddd;
                        }
                        td {
                            padding-top: 0px;
                            padding-bottom: 50px;
                            text-align: right;
                            width: 220px;
                            font-size: 30px;
                        }
                        th {
                            background-color: #16404D;
                            color: white;
                            text-align: center;
                        }
                        tr:nth-child(even) {
                            background-color: #f9f9f9;
                        }
                        tr:hover {
                            background-color: #f1f1f1;
                        }
                        @media print {
                            body {
                                direction: rtl;
                            }
                            .form-container, .print-btn {
                                display: none;
                            }
                            table, th, td {
                                border: 2px solid black;
                            }
                            th {
                                background-color: rgb(255, 255, 255);
                                color: rgb(0, 0, 0);
                            }
                        }
                    </style>
                    <h1>يومية عددية لإدارة موسيقات الشرطة</h1>
                    <div class="form-container">
                        <label for="date-input">حدد اليوم:</label>
                        <input type="date" id="date-input" />
                        <button onclick="fetchNumReport()">عرض</button>
                    </div>
                    <button class="print-btn" onclick="window.print()">طباعة</button>
                    <h3 id="thursday-title">يومية: </h3>
                    <table dir="rtl" id="thursday-table">
                        <thead id="thursday-header"></thead>

                    <h3 id="friday-title" style="display: none;">يومية: </h3>

<script>
    function toEasternArabicNumerals(num) {
        const easternArabicNumerals = ['٠', '١', '٢', '٣', '٤', '٥', '٦', '٧', '٨', '٩'];
        return String(num).replace(/[0-9]/g, (digit) => easternArabicNumerals[digit]);
    }

    document.addEventListener("DOMContentLoaded", function () {
        const tomorrow = new Date();
        tomorrow.setDate(tomorrow.getDate() + 1);
        const formattedTomorrow = tomorrow.toISOString().split("T")[0];
        document.getElementById("date-input").value = formattedTomorrow;
        fetchNumReport();
    });

    function fetchNumReport() {
        const dateInput = document.getElementById("date-input").value;
        const apiUrl = "/attendance/api/numreport/";

        fetch(apiUrl, {
            method: "POST",
            headers: {
                "Content-Type": "application/json",
                "X-CSRFToken": getCSRFToken(),
                "Accept": "application/json",
            },
            body: JSON.stringify({ date: dateInput }),
            credentials: 'include'
        })
            .then((response) => {
                if (!response.ok) {
                    return response.text().then((text) => {
                        throw new Error(`فشل في جلب البيانات: ${response.status} - ${text}`);
                    });
                }
                return response.json();
            })
            .then((data) => {
                updateReport(data);
            })
            .catch((error) => {
                console.error("Error:", error);
                alert(error.message);
            });
    }

    function getCSRFToken() {
        const name = "csrftoken";
        let cookieValue = null;
        if (document.cookie && document.cookie !== "") {
            const cookies = document.cookie.split(";");
            for (let i = 0; i < cookies.length; i++) {
                const cookie = cookies[i].trim();
                if (cookie.substring(0, name.length + 1) === name + "=") {
                    cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
                    break;
                }
            }
        }
        return cookieValue;
    }
