{% extends "base.html" %}
{% load static %}

{% block styles %}
    <style>
        .styled-table {
            border-collapse: collapse;
            margin: 20px 0;
            font-size: 0.7em;
            font-family: sans-serif;
            min-width: 300px;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.15);
            table-layout: fixed;
        }

        .styled-table thead tr {
            background-color: #2c3e50;
            color: rgb(255, 255, 255);
            text-align: center;
        }

        .styled-table th.mm,
        .styled-table td.mm {
            width: 15px !important;
            font-size: 15px;
            padding: 0px;
            border: 1px solid #ddd;
            text-align: center;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .styled-table th.tt,
        .styled-table td.tt {
            width: 40px !important;
            font-size: 20px;
            padding: 0px;
            border: 1px solid #ddd;
            text-align: right;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .styled-table tbody tr {
            border-bottom: 1px solid #ddd;
            min-height: 20px;
            height: 20px;
        }

        .styled-table tbody tr:nth-of-type(even) {
            background-color: #f3f3f3;
        }

        .styled-table tbody tr:last-of-type {
            border-bottom: 2px solid #009879;
        }

        .table-container {
            display: flex;
            width: 100%;
            overflow-x: auto;
            gap: 10px;
        }

        .table-container .table-quarter {
            flex: 1;
        }

        .table-container .table-half {
            flex: 2;
        }

        @media print {
            .form-container,
            .print-btn-container {
                display: none !important;
            }

            .styled-table thead tr {
                background-color: rgb(255, 255, 255);
                color: rgb(0, 0, 0);
                text-align: center;
            }

            .styled-table th,
            .styled-table td {
                font-size: 20px;
                font-weight: bolder;
                padding: 0px;
                border: 1px solid #ddd;
                text-align: right;
                overflow: hidden;
                text-overflow: ellipsis;
                white-space: nowrap;
            }

            .styled-table tbody tr {
                border-bottom: 1px solid #ddd;
                min-height: 30px;
                height: 30px;
            }
        }
    </style>
{% endblock %}

{% block content %}
    <div class="container" dir="rtl">
        <div class="content">
            <div class="form-container">
                <form id="date-form">
                    <label for="date">اختر اليوم:</label>
                    <input type="date" id="date" name="date" value="">
                    <button type="submit">عرض</button>
                </form>
            </div>
            <br>
            <div class="print-btn-container">
                <button onclick="window.print()">طباعة</button>
            </div>
            <h4 id="formatted-date">يومية تمام صباحي عن يوم</h4>
            <table class="styled-table table-quarter">
                <thead>
                    <tr>
                        <th class="mm" style="width:20px">موجود بالتمام</th>
                        <th class="mm">خوارج التمام</th>
                        <th class="mm">اجمالي موجود بالادارة</th>
                        <th class="mm">يومية تعيين غدا</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td class="mm" id="intamam"></td>
                        <td class="mm" id="outtamam"></td>
                        <td class="mm" id="alltamam"></td>
                        <td class="mm" id="tomorrow-food-count"></td>
                    </tr>
                </tbody>
            </table>
            <div class="table-container">
                <!-- Table 1: Non-Music Team -->
                <table class="styled-table table-quarter" id="table1">
                    <thead id="table1-head"></thead>
                    <tbody id="table1-body"></tbody>
                </table>

                <!-- Table 2: Music Team -->
                <table class="styled-table table-half" id="table2">
                    <thead id="table2-head"></thead>
                    <tbody id="table2-body"></tbody>
                </table>

                <!-- Table 3: Non-tmamam -->
                <table class="styled-table table-quarter" id="table3">
                    <thead id="table3-head"></thead>
                    <tbody id="table3-body"></tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        // دالة لتحويل الأرقام اللاتينية إلى أرقام هندية
        function toEasternArabicNumerals(number) {
            const easternNumerals = ['٠', '١', '٢', '٣', '٤', '٥', '٦', '٧', '٨', '٩'];
            return String(number).replace(/[0-9]/g, digit => easternNumerals[digit]);
        }

        // دالة لتحويل تنسيق التاريخ إلى أرقام هندية
        function formatDateWithEasternNumerals(dateStr) {
            // افتراض أن التاريخ بالصيغة "الإثنين 01/02/2023"
            return dateStr.replace(/\d+/g, num => toEasternArabicNumerals(num));
        }

        document.getElementById('date-form').addEventListener('submit', function(event) {
            event.preventDefault();
            const date = document.getElementById('date').value;
            fetchData(date);
        });

        function fetchData(date) {
            const url = date ? `/attendance/api/amtmam/?date=${date}` : '/attendance/api/amtmam/';
            fetch(url, {
                headers: {
                    'Authorization': 'Bearer ' + localStorage.getItem('token'), // Adjust based on your auth method
                    'Content-Type': 'application/json'
                }
            })
            .then(response => response.json())
            .then(data => {
                renderData(data);
            })
            .catch(error => {
                console.error('Error fetching data:', error);
                alert('حدث خطأ أثناء جلب البيانات');
            });
        }

        function renderData(data) {
            // Update summary table with Eastern Arabic numerals
            document.getElementById('formatted-date').textContent = `يومية تمام صباحي عن يوم ${formatDateWithEasternNumerals(data.formatted_date)}`;
            document.getElementById('intamam').textContent = toEasternArabicNumerals(data.intamam);
            document.getElementById('outtamam').textContent = toEasternArabicNumerals(data.outtamam);
            document.getElementById('alltamam').textContent = toEasternArabicNumerals(data.alltamam);
            document.getElementById('tomorrow-food-count').textContent = toEasternArabicNumerals(data.tomorrow_food_count);

            // Render Table 1
            const table1Head = document.getElementById('table1-head');
            const table1Body = document.getElementById('table1-body');
            table1Head.innerHTML = '';
            table1Body.innerHTML = '';
            let table1HeaderRow = '<tr>';
            data.table1_columns.forEach(() => {
                table1HeaderRow += '<th class="mm" style="width:20px">م</th><th class="tt">أفراد إداري</th>';
            });
            table1HeaderRow += '</tr>';
            table1Head.innerHTML = table1HeaderRow;

            for (let i = 0; i < data.num_rows; i++) {
                let row = '<tr>';
                data.table1_columns.forEach(column => {
                    const item = column[i] || { serial_number: '', name: '' };
                    const serialNumber = item.serial_number ? toEasternArabicNumerals(item.serial_number) : '';
                    row += `<td class="mm">${serialNumber}</td><td class="tt">${item.name}</td>`;
                });
                row += '</tr>';
                table1Body.innerHTML += row;
            }

            // Render Table 2
            const table2Head = document.getElementById('table2-head');
            const table2Body = document.getElementById('table2-body');
            table2Head.innerHTML = '';
            table2Body.innerHTML = '';
            let table2HeaderRow = '<tr>';
            data.table2_columns.forEach(() => {
                table2HeaderRow += '<th class="mm" style="width:20px">م</th><th class="tt">فريق الموسيقي</th>';
            });
            table2HeaderRow += '</tr>';
            table2Head.innerHTML = table2HeaderRow;

            for (let i = 0; i < data.num_rows; i++) {
                let row = '<tr>';
                data.table2_columns.forEach(column => {
                    const item = column[i] || { serial_number: '', name: '' };
                    const serialNumber = item.serial_number ? toEasternArabicNumerals(item.serial_number) : '';
                    row += `<td class="mm">${serialNumber}</td><td class="tt">${item.name}</td>`;
                });
                row += '</tr>';
                table2Body.innerHTML += row;
            }

            // Render Table 3
            const table3Head = document.getElementById('table3-head');
            const table3Body = document.getElementById('table3-body');
            table3Head.innerHTML = '';
            table3Body.innerHTML = '';
            let table3HeaderRow = '<tr>';
            data.table3_columns.forEach(() => {
                table3HeaderRow += '<th class="mm" style="width:20px">م</th><th class="tt">خوارج التمام</th>';
            });
            table3HeaderRow += '</tr>';
            table3Head.innerHTML = table3HeaderRow;

            for (let i = 0; i < data.num_rows; i++) {
                let row = '<tr>';
                data.table3_columns.forEach(column => {
                    const item = column[i] || { serial_number: '', name: '' };
                    const serialNumber = item.serial_number ? toEasternArabicNumerals(item.serial_number) : '';
                    row += `<td class="mm">${serialNumber}</td><td class="tt">${item.name}</td>`;
                });
                row += '</tr>';
                table3Body.innerHTML += row;
            }
        }

        // Load default data (tomorrow's date)
        window.onload = function() {
            const tomorrow = new Date();
            tomorrow.setDate(tomorrow.getDate() + 1);
            const formattedDate = tomorrow.toISOString().split('T')[0];
            document.getElementById('date').value = formattedDate;
            fetchData(formattedDate);
        };
    </script>
{% endblock %}
