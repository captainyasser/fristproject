{% extends "base.html" %}
{% load static %}

{% block title %}إدخال حالات متعددة{% endblock %}

{% block content %}
<div class="container-fluid">
    <div class="row">
        <div class="col-md-12">
            <h1>إدخال نفس الحالة لأكثر من فرد لأيام متعددة</h1>

            <div id="error" style="color: red; font-weight: bold; margin-bottom: 15px; display: none;"></div>

            <form id="bulkAttendanceForm" method="POST">
                {% csrf_token %}
                <label for="from_date">من تاريخ:</label>
                <input type="date" id="from_date" name="from_date" required>

                <label for="to_date">حتى تاريخ:</label>
                <input type="date" id="to_date" name="to_date" required>

                <label for="state">الحالة:</label>
                <select id="state" name="state" required>
                    <option value="غير محدد">غير محدد</option>
                    <option value="نوبتجي">نوبتجي</option>
                    <option value="يومي">يومي</option>
                    <option value="راحة">راحة</option>
                    <option value="دورية">دورية</option>
                    <option value="ر بديلة">ر بديلة</option>
                    <option value="طارئة">طارئة</option>
                    <option value="مأمورية">مأمورية</option>
                    <option value="مأمورية خ">مأمورية خ</option>
                    <option value="فرقة">فرقة</option>
                    <option value="انتداب">انتداب</option>
                    <option value="مرضي">مرضي</option>
                    <option value="ج وضع">ج وضع</option>
                    <option value="خاصه">خاصه</option>
                    <option value="8 صباحاً">8 صباحاً</option>
                    <option value="ت دوري">ت دوري</option>
                    <option value="ت تكراري">ت تكراري</option>
                    <option value="منحة">منحة</option>
                    <option value="عطلة">عطلة</option>
                    <option value="غياب">غياب</option>
                    <option value="قرار66">قرار66</option>
                </select>

                <h3>اختر الأسماء:</h3>
                {% for employee in employees %}
                    <div>
                        <input type="checkbox" name="employee_ids" value="{{ employee.id }}" id="employee_{{ employee.id }}">
                        <label for="employee_{{ employee.id }}">{{ employee.name }}</label>
                    </div>
                {% endfor %}

                <button type="submit">تسجيل</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
document.addEventListener('DOMContentLoaded', function() {
    document.getElementById('bulkAttendanceForm').addEventListener('submit', function(e) {
        e.preventDefault();
        const formData = new FormData(this);
        const data = {
            from_date: formData.get('from_date'),
            to_date: formData.get('to_date'),
            state: formData.get('state'),
            employee_ids: Array.from(formData.getAll('employee_ids')).map(Number)
        };

        fetch('/attendance/api/bulk-attendance/', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'X-CSRFToken': '{{ csrf_token }}'
            },
            body: JSON.stringify(data)
        })
        .then(response => response.json())
        .then(data => {
            if (data.error) {
                document.getElementById('error').innerText = data.error;
                document.getElementById('error').style.display = 'block';
            } else {
                alert(data.message);
                window.location.reload();
            }
        })
        .catch(error => {
            console.error('Error submitting form:', error);
            document.getElementById('error').innerText = 'خطأ في تسجيل الحالات';
            document.getElementById('error').style.display = 'block';
        });
    });
});
</script>

<style>
body {
    font-family: 'Cairo', sans-serif;
    background-color: #f4f6f9;
}
h1 {
    text-align: center;
    margin: 20px 0;
    color: #333;
}
form {
    background-color: #fff;
    padding: 20px;
    border-radius: 8px;
    box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
    max-width: 600px;
    margin: auto;
}
label {
    font-weight: bold;
    margin-bottom: 5px;
    display: block;
}
select, input[type="date"] {
    width: 100%;
    padding: 10px;
    margin-bottom: 15px;
    border: 1px solid #ccc;
    border-radius: 4px;
    font-size: 16px;
}
button {
    display: block;
    width: 100%;
    background-color: #007bff;
    color: white;
    border: none;
    padding: 10px;
    border-radius: 4px;
    font-size: 18px;
    font-weight: bold;
    cursor: pointer;
}
button:hover {
    background-color: #0056b3;
}
.container {
    margin-top: 30px;
}
</style>
{% endblock %}
