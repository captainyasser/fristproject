<!-- إزالة تهيئة DataTables العامة لأنها قد تتعارض مع الجداول المخصصة -->
<script>
    // Custom DataTables sorting for 'operations' column
    jQuery.extend(jQuery.fn.dataTableExt.oSort, {
        "operation-sort-pre": function(a) {
            var order = {
                'السبت': 1,
                'الأحد': 2,
                'الاثنين': 3,
                'الثلاثاء': 4,
                'الأربعاء': 5,
                'الخميس': 6,
                'الجمعة': 7,
                'عمل يومي': 8
            };
            // Clean up the string (remove HTML tags if any, trim whitespace)
            var key = a.replace(/<[^>]*>/g, '').trim();
            return order[key] || 99; // Default to 99 for unknown values so they appear last
        },

        "operation-sort-asc": function(a, b) {
            return ((a < b) ? -1 : ((a > b) ? 1 : 0));
        },

        "operation-sort-desc": function(a, b) {
            return ((a < b) ? 1 : ((a > b) ? -1 : 0));
        }
    });
</script>
