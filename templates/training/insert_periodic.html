{% extends "base.html" %}
{% load static %}

{% block title %}إدخال تدريب دوري{% endblock %}

{% block styles %}
<style>
    .insert-container {
        padding: 30px;
    }
    .form-card {
        border-radius: 15px;
        box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        border: none;
    }
    .card-header {
        background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
        color: white;
        border-radius: 15px 15px 0 0 !important;
        font-weight: bold;
    }
    .employee-list {
        max-height: 400px;
        overflow-y: auto;
        border: 1px solid #ddd;
        padding: 15px;
        border-radius: 10px;
        background: #fdfdfd;
    }
    .employee-item {
        padding: 8px;
        border-bottom: 1px solid #eee;
        transition: background 0.2s;
    }
    .employee-item:hover {
        background: #f1f7ff;
    }
    label { font-weight: bold; }
</style>
{% endblock %}

{% block content %}
<div class="insert-container">
    <div class="card form-card">
        <div class="card-header py-3">
            <h3 class="mb-0"><i class="fas fa-plus-circle mr-2"></i> إدخال دورة تدريب دوري</h3>
        </div>
        <div class="card-body">
            <form method="POST" id="training-form">
                {% csrf_token %}
                <div class="row">
                    <!-- عمود اختيار الأفراد -->
                    <div class="col-md-5">
                        <div class="form-group">
                            <label>اختر الأفراد (يمكنك البحث بالاختبار):</label>
                            <input type="text" id="search-emp" class="form-control mb-2" placeholder="بحث بالاسم أو رقم الشرطة...">
                            <div class="employee-list" id="emp-list">
                                {% for emp in employees %}
                                <div class="employee-item">
                                    <div class="custom-control custom-checkbox">
                                        <input type="checkbox" class="custom-control-input emp-check" 
                                               id="emp_{{ emp.id }}" name="employees" value="{{ emp.id }}">
                                        <label class="custom-control-label" for="emp_{{ emp.id }}">
                                            {{ emp.rank }} / {{ emp.name }} [{{ emp.police_number }}]
                                        </label>
                                    </div>
                                </div>
                                {% endfor %}
                            </div>
                        </div>
                    </div>

                    <!-- عمود بيانات الدورة -->
                    <div class="col-md-7">
                        <div class="row">
                            <div class="col-md-6">
                                <div class="form-group">
                                    <label>نوع التدريب الدوري:</label>
                                    <select name="training_type" class="form-control" required>
                                        <option value="">-- اختر النوع --</option>
                                        {% for t in training_types %}
                                        <option value="{{ t.id }}">{{ t.name }}</option>
                                        {% endfor %}
                                    </select>
                                </div>
                            </div>
                            <div class="col-md-6">
                                <div class="form-group">
                                    <label>مكان التدريب:</label>
                                    <select name="place" class="form-control" required>
                                        <option value="">-- اختر المكان --</option>
                                        {% for p in places %}
                                        <option value="{{ p.id }}">{{ p.name }}</option>
                                        {% endfor %}
                                    </select>
                                </div>
                            </div>
                        </div>

                        <div class="row mt-3">
                            <div class="col-md-6">
                                <div class="form-group">
                                    <label>تاريخ البداية:</label>
                                    <input type="date" name="start_date" class="form-control" required>
                                </div>
                            </div>
                            <div class="col-md-6">
                                <div class="form-group">
                                    <label>تاريخ النهاية:</label>
                                    <input type="date" name="end_date" class="form-control" required>
                                </div>
                            </div>
                        </div>

                        <div class="form-group mt-3">
                            <label>رقم الدورة / الدفعة (اختياري):</label>
                            <input type="text" name="round_num" class="form-control" placeholder="مثلاً: الدفعة 45">
                        </div>

                        <div class="form-group mt-3">
                            <label>ملاحظات:</label>
                            <textarea name="note" class="form-control" rows="3"></textarea>
                        </div>

                        <div class="mt-4 text-center">
                            <button type="submit" class="btn btn-primary btn-lg px-5">
                                <i class="fas fa-save mr-2"></i> حفظ السجلات وتحديث الحضور
                            </button>
                            <a href="{% url 'periodic_dashboard' %}" class="btn btn-secondary btn-lg px-5 ml-2">إلغاء</a>
                        </div>
                    </div>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
    // بحث ذكي في قائمة الأفراد
    document.getElementById('search-emp').addEventListener('keyup', function() {
        let val = this.value.trim().toLowerCase();
        let items = document.querySelectorAll('.employee-item');
        items.forEach(item => {
            let label = item.innerText.toLowerCase();
            item.style.display = label.includes(val) ? 'block' : 'none';
        });
    });
</script>
{% endblock %}
