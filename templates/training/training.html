{% extends "base.html" %}
{% load static %}
{% block content %}
<title>الفرق التدريبية</title>
        <div class="container-fluid">
            <div class="row">
                <div class="col-md-12">
                    <div style="display: flex; justify-content: center;">
                        <h1>الفرق التدريبية</h1>
                    </div>
                    <br>
                    <div class="btn-container">
                        <button class="btn btn-block btn-outline-secondary btn-lg" onclick="window.open('{% url 'em_training_teams' %}', '_blank')">دفتر الفرق باسم الفرد</button>
                        <button class="btn btn-block btn-outline-secondary btn-lg" onclick="window.open('{% url 'training_teams' %}', '_blank')">دفتر الفرق باسم الفرقة</button>
                        <button class="btn btn-block btn-outline-secondary btn-lg" onclick="window.open('{% url 'training_teams_filter' %}', '_blank')">فلتر الفرق</button>

                        <button class="btn btn-block btn-outline-secondary btn-lg" onclick="window.open('{% url 'edit-training-record' %}', '_blank')">تعديل الفرق للافراد</button>
                    </div>
                </div>
            </div>
        </div>
{% endblock %}
