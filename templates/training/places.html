{% extends "base.html" %}
{% block content %}

<h2>إدارة الأماكن</h2>
<button class="btn btn-primary" onclick="openModal()">إضافة مكان جديد</button>

<table class="table table-striped mt-3">
    <thead>
        <tr>
            <th>الاسم</th>
            <th>الوصف</th>
            <th>العنوان</th>
            <th>الإجراءات</th>
        </tr>
    </thead>
    <tbody>
        {% for place in places %}
        <tr>
            <td>{{ place.name }}</td>
            <td>{{ place.description }}</td>
            <td>{{ place.address }}</td>
            <td>
                <button class="btn btn-warning" onclick="openModal('{{ place.id }}', '{{ place.name }}', '{{ place.description }}', '{{ place.address }}')">تعديل</button>
                <form method="POST" style="display:inline;">
                    {% csrf_token %}
                    <input type="hidden" name="place_id" value="{{ place.id }}">
                    <input type="hidden" name="delete" value="true">
                    <button type="submit" class="btn btn-danger">حذف</button>
                </form>
            </td>
        </tr>
        {% endfor %}
    </tbody>
</table>

<!-- Modal for Add/Edit -->
<div id="placeModal" class="modal" style="display:none;">
    <div class="modal-content">
        <span class="close" onclick="closeModal()">&times;</span>
        <h3 id="modalTitle">إضافة مكان جديد</h3>
        <form method="POST">
            {% csrf_token %}
            <input type="hidden" id="place_id" name="place_id">
            <label>الاسم:</label>
            <input type="text" id="name" name="name" class="form-control" required>
            <label>الوصف:</label>
            <textarea id="description" name="description" class="form-control"></textarea>
            <label>العنوان:</label>
            <textarea id="address" name="address" class="form-control"></textarea>
            <button type="submit" class="btn btn-success mt-2">حفظ</button>
            <button type="button" class="btn btn-secondary mt-2" onclick="closeModal()">إلغاء</button>
        </form>
    </div>
</div>

<style>
    .modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.5); display: flex; align-items: center; justify-content: center; }
    .modal-content { background: white; padding: 20px; border-radius: 10px; width: 40%; }
    .close { float: right; cursor: pointer; font-size: 20px; }
</style>

<script>
    function openModal(id='', name='', description='', address='') {
        document.getElementById('place_id').value = id;
        document.getElementById('name').value = name;
        document.getElementById('description').value = description;
        document.getElementById('address').value = address;
        document.getElementById('modalTitle').textContent = id ? 'تعديل المكان' : 'إضافة مكان جديد';
        document.getElementById('placeModal').style.display = 'block';
    }
    
    function closeModal() {
        document.getElementById('placeModal').style.display = 'none';
    }
</script>

{% endblock %}
