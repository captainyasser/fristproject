{% extends "base.html" %}
{% block content %}
<h2>{% if form.instance.pk %}تعديل المكان{% else %}إضافة مكان جديد{% endif %}</h2>
<form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="btn btn-success">حفظ</button>
    <a href="{% url 'places_list' %}" class="btn btn-secondary">إلغاء</a>
</form>
{% endblock %}
